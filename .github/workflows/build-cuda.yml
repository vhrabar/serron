name: CUDA Compile Check

permissions:
  contents: read

on:
  push:
    branches: [dev, main]
    paths:
      - 'csrc/**'
      - '**/*.cu'
      - '**/*.cuh'
      - '**/*.cpp'
      - '**/*.h'
      - '**/CMakeLists.txt'
      - '**/torch-ext/**'
      - 'CHANGELOG.md'
      - 'pyproject.toml'
      - 'uv.lock'
  pull_request:
    branches: [main]
    paths:
      - 'csrc/**'
      - '**/*.cu'
      - '**/*.cuh'
      - '**/*.cpp'
      - '**/*.h'
      - '**/CMakeLists.txt'
      - '**/torch-ext/**'
      - 'CHANGELOG.md'
      - 'pyproject.toml'
      - 'uv.lock'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  cuda-build:
    runs-on: ubuntu-26.04
    env:
      CUDA_HOME: /usr/local/cuda-13.3
      CUDAToolkit_ROOT: /usr/local/cuda-13.3
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # free disk space
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          df -h

      # cache
      - name: Cache CUDA toolkit
        id: cache-cuda
        uses: actions/cache@v4
        with:
          path: /usr/local/cuda-13.3
          key: cuda-13.3-${{ runner.os }}-v1

      # Install CUDA compiler
      - name: Install CUDA compiler
        if: steps.cache-cuda.outputs.cache-hit != 'true'
        run: |
          wget -q https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2604/x86_64/cuda-keyring_1.1-1_all.deb
          sudo dpkg -i cuda-keyring_1.1-1_all.deb
          sudo apt-get update -q
          sudo apt-get install -y cuda-compiler-13-3 cuda-libraries-dev-13-3

      - name: Add CUDA to PATH
        run: echo "/usr/local/cuda-13.3/bin" >> "$GITHUB_PATH"

      - name: Verify nvcc
        run: nvcc --version

      # uv package manager
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      # Installs project dependencies
      - name: Install build dependencies
        run: uv sync --package serron --no-dev --group build --no-install-workspace --extra cu132

      # Build CUDA extension
      - name: Compile CUDA extension
        run: uv build --package serron --wheel --no-build-isolation
        env:
          MAX_JOBS: "2"

  # Refresh the rolling release draft once the CUDA backend is known to compile.
  release-draft:
    name: Release draft
    needs: [cuda-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # A single rolling draft: drop the previous one so its notes can never go stale.
      - name: Remove old release drafts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api repos/{owner}/{repo}/releases \
            --jq '.[] | select(.draft == true) | .id' \
            | xargs -r -I '{}' gh api -X DELETE repos/{owner}/{repo}/releases/{}

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Create release draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="$(python3 -c 'import pathlib, tomllib; print(tomllib.loads(pathlib.Path("packages/serron/pyproject.toml").read_text())["project"]["version"])')"
          TAG="v${VERSION}"

          # Anything still under this tag after the draft sweep is already published.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::notice::$TAG is already released - bump project.version on dev to prepare the next one"
            exit 0
          fi

          # Notes come from dev: main's CHANGELOG.md carries only released history.
          git fetch --depth=1 origin dev
          git show FETCH_HEAD:CHANGELOG.md > dev-changelog.md

          NOTES="$(mktemp)"
          uvx --from python-kacl==0.7.3 kacl-cli -f dev-changelog.md get unreleased --no-header > "$NOTES"
          rm -f dev-changelog.md

          if [ -s "$NOTES" ]; then
            gh release create "$TAG" --draft --title "$TAG" --notes-file "$NOTES"
          else
            echo "::warning::dev CHANGELOG.md has no unreleased entries, falling back to generated notes"
            gh release create "$TAG" --draft --title "$TAG" --generate-notes
          fi
