name: CUDA Compile Check

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches: [dev, main]
    paths:
      - 'csrc/**'
      - '**/*.cu'
      - '**/*.cuh'
      - '**/*.cpp'
      - '**/*.h'
      - '**/CMakeLists.txt'
      - '**/torch-ext/**'
      - 'CHANGELOG.md'
      - 'pyproject.toml'
      - 'uv.lock'
  pull_request:
    branches: [dev, main]
    paths:
      - 'csrc/**'
      - '**/*.cu'
      - '**/*.cuh'
      - '**/*.cpp'
      - '**/*.h'
      - '**/CMakeLists.txt'
      - '**/torch-ext/**'
      - 'CHANGELOG.md'
      - 'pyproject.toml'
      - 'uv.lock'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  cuda-build:
    name: cuda-build (CUDA ${{ matrix.cuda }}, ${{ matrix.torch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        torch: [cu132, cu132-newest]
        cuda: ["12.9.1", "13.3.1"]
        include:
          - cuda: "12.9.1"
            runner: ubuntu-24.04
            gcc: "14"
          - cuda: "13.3.1"
            runner: ubuntu-26.04
            gcc: "15"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # free disk space; the toolkit runfile and its extraction need several GB
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          df -h

      - name: Install host compiler
        run: |
          sudo apt-get update -q
          sudo apt-get install -y gcc-${{ matrix.gcc }} g++-${{ matrix.gcc }}
          {
            echo "CC=gcc-${{ matrix.gcc }}"
            echo "CXX=g++-${{ matrix.gcc }}"
            echo "CUDAHOSTCXX=g++-${{ matrix.gcc }}"
          } >> "$GITHUB_ENV"

      - name: Install CUDA toolkit
        id: cuda-toolkit
        uses: Jimver/cuda-toolkit@v0.2.36
        with:
          cuda: ${{ matrix.cuda }}
          method: local
          linux-local-args: '["--toolkit", "--tmpdir=${{ runner.temp }}"]'
          use-github-cache: false
          log-file-suffix: "${{ matrix.cuda }}-${{ matrix.torch }}.txt"

      - name: Point the build at the toolkit
        run: |
          echo "CUDA_HOME=${{ steps.cuda-toolkit.outputs.CUDA_PATH }}" >> "$GITHUB_ENV"
          echo "CUDAToolkit_ROOT=${{ steps.cuda-toolkit.outputs.CUDA_PATH }}" >> "$GITHUB_ENV"

      - name: Verify toolchain
        run: |
          nvcc --version
          "$CXX" --version

      # uv package manager
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      # Installs project dependencies
      - name: Install build dependencies
        run: uv sync --no-install-workspace --no-default-groups --group dev --group ${{ matrix.torch }}

      # Build CUDA extension
      - name: Compile CUDA extension
        run: uv build --package serron --wheel --no-build-isolation
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: "2"

      - name: Check CUDA linkage
        run: scripts/check_cuda_linkage.sh dist/serron-*.whl

      - name: Load next to a CUDA 12 torch
        if: matrix.torch == 'cu132-newest'
        working-directory: ${{ runner.temp }}
        run: |
          uv venv cu12 --python 3.14
          uv pip install --python cu12 --index-url https://download.pytorch.org/whl/cu129 "torch==2.13.*"
          uv pip install --python cu12 --no-deps "${GITHUB_WORKSPACE}"/dist/serron-*.whl
          cu12/bin/python - <<'EOF'
          import torch
          import serron

          assert torch.version.cuda.startswith("12."), torch.version.cuda
          for op in ("erode", "dilate", "erode_backward", "dilate_backward"):
              assert torch._C._dispatch_has_kernel_for_dispatch_key(f"serron::{op}", "CUDA"), op
          print("serron loads its CUDA kernels on torch", torch.__version__)
          EOF

  cuda-build-windows:
    name: cuda-build-windows (CUDA ${{ matrix.cuda }}, ${{ matrix.torch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        torch: [cu132, cu132-newest]
        cuda: ["12.9.1", "13.3.1"]
        include:
          - cuda: "12.9.1"
            runner: windows-2022
          - cuda: "13.3.1"
            runner: windows-2025
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install CUDA toolkit
        uses: Jimver/cuda-toolkit@v0.2.36
        with:
          cuda: ${{ matrix.cuda }}
          method: local
          use-github-cache: false
          log-file-suffix: "windows-${{ matrix.cuda }}-${{ matrix.torch }}.txt"

      - name: Verify toolchain
        run: nvcc --version

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install build dependencies
        run: uv sync --no-install-workspace --no-default-groups --group dev --group ${{ matrix.torch }}

      - name: Compile CUDA extension
        run: uv build --package serron --wheel --no-build-isolation
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: "2"
