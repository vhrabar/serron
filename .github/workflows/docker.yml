name: Build and Publish to GHCR

on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: build-and-push (${{ matrix.flavor }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - flavor: cuda12
            cuda: "12.9.1"
            ubuntu: "24.04"
            torch_group: cu129
          - flavor: cuda13
            cuda: "13.3.0"
            ubuntu: "26.04"
            torch_group: cu132-newest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # free disk space
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          df -h

      # init
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # set metadata
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            suffix=-${{ matrix.flavor }},onlatest=true
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      # build into the local daemon first, so the image can be checked before anything is pushed
      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: serron:smoke
          build-args: |
            CUDA_VERSION=${{ matrix.cuda }}
            UBUNTU_VERSION=${{ matrix.ubuntu }}
            TORCH_GROUP=${{ matrix.torch_group }}
          cache-from: type=gha,scope=${{ matrix.flavor }}
          cache-to: type=gha,mode=max,scope=${{ matrix.flavor }}

      # No GPU on the runner, but the loader still opens _C_cuda whenever torch is a CUDA build, so this proves
      # the extension resolves against the image's torch and CUDA runtime.
      - name: Smoke test
        run: |
          docker run --rm serron:smoke python -c "
          import torch, serron
          assert torch.version.cuda.startswith('${{ matrix.cuda }}'.split('.')[0] + '.'), torch.version.cuda
          print('torch', torch.__version__, 'cuda', torch.version.cuda, 'serron ok')
          "

      - name: Push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            CUDA_VERSION=${{ matrix.cuda }}
            UBUNTU_VERSION=${{ matrix.ubuntu }}
            TORCH_GROUP=${{ matrix.torch_group }}
          cache-from: type=gha,scope=${{ matrix.flavor }}