name: Build Release Wheels

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

env:
  PACKAGE: serron
  PKG_DIR: packages/serron
  CUDA_VERSION: "13.2.0"
  BUILD_PYTHON_TAG: cp312-cp312
  BUILD_PYTHON: "3.12"
  TORCH_INDEX: https://download.pytorch.org/whl/cu132
  PIP_RETRIES: "5"
  PIP_TIMEOUT: "60"
  PIP_RESUME_RETRIES: "5"

jobs:
  # Fail fast on a tag that does not match the packaged version, before an hour of wheel builds
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Check tag against project.version
        id: version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION="$(python3 -c 'import pathlib, tomllib; print(tomllib.loads(pathlib.Path("packages/serron/pyproject.toml").read_text())["project"]["version"])')"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

          if [ "${{ github.event_name }}" != "release" ]; then
            echo "::notice::manual run, skipping the tag check (version ${VERSION})"
            exit 0
          fi
          if [ "$TAG" != "v${VERSION}" ]; then
            echo "::error::release tag '$TAG' does not match project.version '$VERSION' in packages/serron/pyproject.toml"
            exit 1
          fi

  # Source distribution
  sdist:
    needs: [verify]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"

      - name: Install build dependencies
        run: uv sync --package serron --no-dev --group build --no-install-workspace

      - name: Build sdist
        run: uv build --package "${PACKAGE}" --sdist --out-dir dist

      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz

  # Linux wheels (x86_64 + aarch64)
  linux-wheels:
    needs: [verify]
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
        include:
          - arch: x86_64
            runner: ubuntu-latest
            container: quay.io/pypa/manylinux_2_28_x86_64
          - arch: aarch64
            runner: ubuntu-24.04-arm
            container: quay.io/pypa/manylinux_2_28_aarch64
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    env:
      CC: /opt/rh/gcc-toolset-14/root/usr/bin/gcc
      CXX: /opt/rh/gcc-toolset-14/root/usr/bin/g++
      CUDAHOSTCXX: /opt/rh/gcc-toolset-14/root/usr/bin/g++
    steps:
      - uses: actions/checkout@v7

      # The toolkit action runs its installer through sudo, which the manylinux image does not ship.
      - name: Install sudo and host compiler
        run: dnf -y install sudo gcc-toolset-14-gcc gcc-toolset-14-gcc-c++

      - name: Install CUDA toolkit
        id: cuda-toolkit
        uses: Jimver/cuda-toolkit@v0.2.36
        with:
          cuda: ${{ env.CUDA_VERSION }}
          method: local
          linux-local-args: '["--toolkit"]'
          use-github-cache: false
          log-file-suffix: "${{ matrix.arch }}.txt"

      - name: Build wheel
        env:
          CUDA_HOME: ${{ steps.cuda-toolkit.outputs.CUDA_PATH }}
          CMAKE_BUILD_PARALLEL_LEVEL: "2"
        run: |
          export PATH="/opt/python/${{ env.BUILD_PYTHON_TAG }}/bin:${PATH}"
          nvcc --version
          "$CXX" --version
          python -m pip install --upgrade pip
          # CUDA-enabled torch used only to compile against (no build isolation). The spec comes from
          # ${PKG_DIR}/pyproject.toml [project].dependencies, so the wheel is built against the torch minor it declares.
          torch_req="$(python -c 'import pathlib, tomllib; print(next(d for d in tomllib.loads(pathlib.Path("'"${PKG_DIR}"'/pyproject.toml").read_text())["project"]["dependencies"] if d.startswith("torch")))')"
          python -m pip install --index-url "${TORCH_INDEX}" "${torch_req}"
          # Build backend pin comes from ${PKG_DIR}/pyproject.toml [build-system].requires,
          # so --no-isolation installs exactly what the project asks for.
          build_reqs="$(python -c 'import pathlib, tomllib; print(" ".join(tomllib.loads(pathlib.Path("'"${PKG_DIR}"'/pyproject.toml").read_text())["build-system"]["requires"]))')"
          python -m pip install ${build_reqs} cmake ninja build auditwheel
          python -m build --wheel --no-isolation "${PKG_DIR}" --outdir dist_raw

      - name: Repair wheel (retag manylinux, do not vendor torch/cuda)
        run: |
          export PATH="/opt/python/${{ env.BUILD_PYTHON_TAG }}/bin:${PATH}"
          auditwheel repair dist_raw/*.whl --wheel-dir dist \
            --exclude 'libtorch*.so*' \
            --exclude 'libc10*.so*' \
            --exclude 'libcudart.so*' \
            --exclude 'libcublas*.so*' \
            --exclude 'libcuda.so*' \
            --exclude 'libnvToolsExt.so*'

      - uses: actions/upload-artifact@v7
        with:
          name: wheels-linux-${{ matrix.arch }}
          path: dist/*.whl

  # Install the one Linux wheel next to a CPU-only torch and run an op forward and backward. Two axes: every
  # supported interpreter, which is what proves a single py3-none wheel loads on all of them, and both ends of
  # the declared torch range, which is what proves the stable ABI holds. This is also the setup where a
  # CUDA-linked _C used to fail at import (libc10_cuda.so missing).
  smoke-test-cpu:
    needs: [linux-wheels]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
        torch: [floor, newest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - uses: actions/download-artifact@v8
        with:
          name: wheels-linux-x86_64
          path: dist

      - name: Install wheel with CPU-only torch
        env:
          TORCH_AXIS: ${{ matrix.torch }}
        run: |
          # The spec comes from ${PKG_DIR}/pyproject.toml, so the floor is not duplicated here: "newest" takes the
          # declared range as-is, "floor" pins its lower bound exactly.
          torch_req="$(python "${GITHUB_WORKSPACE}/scripts/torch_req.py")"
          echo "installing ${torch_req}"
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "${torch_req}"
          python -m pip install --no-index --find-links dist "${PACKAGE}"

      - name: Import and run on CPU
        # Run outside the checkout so the source tree does not shadow the installed package.
        working-directory: ${{ runner.temp }}
        run: |
          python - <<'EOF'
          import torch
          import serron
          from serron import structuring_element as se

          assert torch.version.cuda is None, torch.version.cuda
          x = torch.rand(2, 3, 16, 16, requires_grad=True)
          k = se.disk(2).requires_grad_()
          serron.opening(x, k).sum().backward()
          assert x.grad is not None and k.grad is not None
          print("serron", serron.__version__, "OK on torch", torch.__version__)
          EOF

  # Windows wheel (x86_64)
  windows-wheel:
    needs: [verify]
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.BUILD_PYTHON }}

      - name: Install CUDA toolkit
        id: cuda-toolkit
        uses: Jimver/cuda-toolkit@v0.2.36
        with:
          cuda: ${{ env.CUDA_VERSION }}
          method: local
          use-github-cache: false

      - name: Verify CUDA CRT headers
        shell: cmd
        run: dir "%CUDA_PATH%\include\crt"

      - name: Build wheel
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: "2"
        run: |
          python -m pip install --upgrade pip
          $torchReq = python -c "import pathlib, tomllib; print(next(d for d in tomllib.loads(pathlib.Path('${env:PKG_DIR}/pyproject.toml').read_text())['project']['dependencies'] if d.startswith('torch')))"
          python -m pip install --index-url "${env:TORCH_INDEX}" "$torchReq"
          $buildReqs = python -c "import pathlib, tomllib; print(' '.join(tomllib.loads(pathlib.Path('${env:PKG_DIR}/pyproject.toml').read_text())['build-system']['requires']))"
          python -m pip install $buildReqs.Split() cmake ninja build
          python -m build --wheel --no-isolation "${env:PKG_DIR}" --outdir dist

      - uses: actions/upload-artifact@v7
        with:
          name: wheels-windows-x86_64
          path: dist/*.whl

  # Attach every artifact to the GitHub Release
  attach-to-release:
    if: github.event_name == 'release'
    needs: [sdist, linux-wheels, smoke-test-cpu, windows-wheel]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Upload assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/* --clobber --repo "${{ github.repository }}"
