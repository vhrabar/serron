name: Build Release Wheels

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

env:
  PACKAGE: serron
  PKG_DIR: packages/serron
  CUDA_MAJOR_MINOR: "13-2"
  TORCH_INDEX: https://download.pytorch.org/whl/cu132
  PIP_RETRIES: "5"
  PIP_TIMEOUT: "60"
  PIP_RESUME_RETRIES: "5"

jobs:
  # Fail fast on a tag that does not match the packaged version, before an hour of wheel builds
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Check tag against project.version
        id: version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION="$(python3 -c 'import pathlib, tomllib; print(tomllib.loads(pathlib.Path("packages/serron/pyproject.toml").read_text())["project"]["version"])')"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

          if [ "${{ github.event_name }}" != "release" ]; then
            echo "::notice::manual run, skipping the tag check (version ${VERSION})"
            exit 0
          fi
          if [ "$TAG" != "v${VERSION}" ]; then
            echo "::error::release tag '$TAG' does not match project.version '$VERSION' in packages/serron/pyproject.toml"
            exit 1
          fi

  # Source distribution
  sdist:
    needs: [verify]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"

      - name: Install build dependencies
        run: uv sync --package serron --no-dev --group build --no-install-workspace

      - name: Build sdist
        run: uv build --package "${PACKAGE}" --sdist --out-dir dist

      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  # Linux wheels (x86_64 + aarch64)
  linux-wheels:
    needs: [verify]
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
        python: [cp312-cp312, cp313-cp313, cp314-cp314]
        include:
          - arch: x86_64
            runner: ubuntu-latest
            container: quay.io/pypa/manylinux_2_28_x86_64
            cuda_repo: rhel8/x86_64
          - arch: aarch64
            runner: ubuntu-24.04-arm
            container: quay.io/pypa/manylinux_2_28_aarch64
            cuda_repo: rhel8/sbsa
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    steps:
      - uses: actions/checkout@v4

      - name: Install CUDA toolkit
        run: |
          dnf -y install dnf-plugins-core
          dnf config-manager --add-repo \
            "https://developer.download.nvidia.com/compute/cuda/repos/${{ matrix.cuda_repo }}/cuda-rhel8.repo"
          dnf -y install "cuda-compiler-${CUDA_MAJOR_MINOR}" "cuda-libraries-devel-${CUDA_MAJOR_MINOR}"

      - name: Build wheel
        env:
          CUDA_HOME: /usr/local/cuda-13.2
          MAX_JOBS: "2"
        run: |
          export PATH="/usr/local/cuda-13.2/bin:/opt/python/${{ matrix.python }}/bin:${PATH}"
          python -m pip install --upgrade pip
          # CUDA-enabled torch used only to compile against (no build isolation).
          python -m pip install --index-url "${TORCH_INDEX}" "torch>=2.12"
          python -m pip install scikit-build-core==1.0.2 cmake ninja build auditwheel
          python -m build --wheel --no-isolation "${PKG_DIR}" --outdir dist_raw

      - name: Repair wheel (retag manylinux, do not vendor torch/cuda)
        run: |
          export PATH="/opt/python/${{ matrix.python }}/bin:${PATH}"
          auditwheel repair dist_raw/*.whl --wheel-dir dist \
            --exclude 'libtorch*.so*' \
            --exclude 'libc10*.so*' \
            --exclude 'libcudart.so*' \
            --exclude 'libcublas*.so*' \
            --exclude 'libcuda.so*' \
            --exclude 'libnvToolsExt.so*'

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-${{ matrix.arch }}-${{ matrix.python }}
          path: dist/*.whl

  # Windows wheel (x86_64)
  windows-wheel:
    needs: [verify]
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install CUDA toolkit
        uses: Jimver/cuda-toolkit@v0.2.35
        with:
          cuda: "13.2.0"
          method: local

      - name: Verify CUDA CRT headers
        shell: cmd
        run: dir "C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v13.2\include\crt"

      - name: Build wheel
        env:
          MAX_JOBS: "2"
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url "${env:TORCH_INDEX}" "torch>=2.12"
          python -m pip install scikit-build-core==1.0.2 cmake ninja build
          python -m build --wheel --no-isolation "${env:PKG_DIR}" --outdir dist

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-windows-x86_64-${{ matrix.python }}
          path: dist/*.whl

  # Attach every artifact to the GitHub Release
  attach-to-release:
    if: github.event_name == 'release'
    needs: [sdist, linux-wheels, windows-wheel]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Upload assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/* --clobber --repo "${{ github.repository }}"

  # CHANGELOG.md is split: dev carries only the Unreleased section, main carries the full history.
  # This lifts dev's entries into main's history, then clears them from dev. One pull request each.
  changelog:
    if: github.event_name == 'release'
    needs: [verify, attach-to-release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      TAG: ${{ github.event.release.tag_name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      LABEL: release changelog
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: main

      - uses: actions/checkout@v4
        with:
          ref: dev
          path: dev

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Check dev for unreleased entries
        id: entries
        run: |
          if [ -z "$(uvx --from python-kacl==0.7.3 kacl-cli -f dev/CHANGELOG.md get unreleased --no-header)" ]; then
            echo "empty=true" >> "$GITHUB_OUTPUT"
            echo "::warning::dev CHANGELOG.md has no unreleased entries - nothing to move into $TAG"
          fi

      # kacl merges any .kacl_stash/*.md into Unreleased before releasing, and consumes the stash afterwards.
      # dev's CHANGELOG.md is itself a valid stash file, so it needs no conversion.
      - name: Add dev's entries to main's history
        if: steps.entries.outputs.empty != 'true'
        working-directory: main
        run: |
          mkdir -p .kacl_stash
          cp ../dev/CHANGELOG.md .kacl_stash/dev.md
          uvx --from python-kacl==0.7.3 kacl-cli release "$VERSION" --modify --auto-link
          rm -rf .kacl_stash

      - name: Open changelog pull request against main
        if: steps.entries.outputs.empty != 'true'
        working-directory: main
        run: |
          BRANCH="changelog-update-${TAG}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout -b "$BRANCH"
          git commit -am "docs(changelog): add ${TAG} to the changelog"
          git push --force-with-lease --set-upstream origin "$BRANCH"

          gh label create "$LABEL" --description "Pull requests with a release changelog update" --force || true

          gh pr create \
            --title "Changelog update - \`${TAG}\`" \
            --body "Adds the \`${TAG}\` section to \`CHANGELOG.md\` from dev's unreleased entries, and refreshes the compare links." \
            --label "$LABEL" \
            --base main \
            --head "$BRANCH"

      - name: Clear dev's unreleased section
        if: steps.entries.outputs.empty != 'true'
        working-directory: dev
        run: |
          uvx --from python-kacl==0.7.3 kacl-cli stash --modify
          rm -rf .kacl_stash
          # 'kacl-cli link generate' cannot work here: dev's file has no released versions to compare against.
          sed -i -E "s|/compare/v[0-9]+\.[0-9]+\.[0-9]+\.\.\.HEAD|/compare/${TAG}...HEAD|" CHANGELOG.md

      - name: Open changelog pull request against dev
        if: steps.entries.outputs.empty != 'true'
        working-directory: dev
        run: |
          BRANCH="changelog-clear-${TAG}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout -b "$BRANCH"
          git commit -am "docs(changelog): clear unreleased entries shipped in ${TAG}"
          git push --force-with-lease --set-upstream origin "$BRANCH"

          gh pr create \
            --title "Changelog cleanup - \`${TAG}\`" \
            --body "Clears the \`Unreleased\` entries that shipped in \`${TAG}\`. They now live in \`CHANGELOG.md\` on \`main\`." \
            --label "$LABEL" \
            --base dev \
            --head "$BRANCH"
