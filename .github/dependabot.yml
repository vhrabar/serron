version: 2

registries:
  pytorch-cpu:
    type: python-index
    url: https://download.pytorch.org/whl/cpu
  pytorch-cu129:
    type: python-index
    url: https://download.pytorch.org/whl/cu129
  pytorch-cu132:
    type: python-index
    url: https://download.pytorch.org/whl/cu132
  pytorch-cu134:
    type: python-index
    url: https://download.pytorch.org/whl/cu134
  nvidia-cu134-win-arm64:
    type: python-index
    url: https://pypi.nvidia.com/nvtorch_oot/
  pytorch-rocm100:
    type: python-index
    url: https://download.pytorch.org/whl/rocm10.0
  amd-rocm:
    type: python-index
    url: https://stable.repo.amd.com/rocm/core/whl-next

updates:
  # Python dependencies
  - package-ecosystem: "uv"
    directory: "/"
    target-branch: "dev"
    registries: "*"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    versioning-strategy: increase-if-necessary
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "torch"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    groups:
      dev-tools:
        patterns: ["ruff", "pyrefly", "prek", "pytest", "pytest-*", "cmake", "ninja", "scikit-build-core"]
      bench-and-stubs:
        patterns: ["kornia", "*-stubs"]
      python:
        patterns: ["*"]

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ["*"]

  # Dockerfile base images
  - package-ecosystem: "docker"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      docker:
        patterns: ["*"]
