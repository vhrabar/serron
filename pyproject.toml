[project]
name = "serron-workspace"
version = "0"
dependencies = [
    "kornia>=0.8.3",
    "scikit-build-core==1.1.1",
    "scipy-stubs~=1.18.1.1",
    "serron",
    "torch>=2.13",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
serron = { workspace = true }
torch = [
    { index = "pytorch-cpu", group = "cpu" },
    { index = "pytorch-cpu", group = "cpu-newest" },
    { index = "pytorch-cu132", group = "cu132" },
    { index = "pytorch-cu132", group = "cu132-newest" },
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-benchmark",
    "ruff==0.16.10",
    "pyrefly",
    "scikit-build-core",
    "cmake==4.4.4",
    "ninja",
]
cpu = ["torch==2.13.*"]
cu132 = ["torch==2.13.*"]
cpu-newest = ["torch>=2.14"]
cu132-newest = ["torch>=2.14"]

[tool.uv]
no-build-isolation-package = ["serron"]
default-groups = ["dev", "cu132-newest"]
conflicts = [
    [
        { group = "cpu" },
        { group = "cu132" },
        { group = "cpu-newest" },
        { group = "cu132-newest" },
    ],
]


[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py", "bench_*.py"]
addopts = "-ra --strict-markers"
markers = [
    "cuda: test requires a CUDA device",
]


[tool.ruff]
line-length = 130


[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "UP",
    "B",
    "SIM",
    "NPY",
    "RUF",
]
ignore = [
    "E501",
    "RUF012",
]

[tool.ruff.lint.per-file-ignores]
"__init__.py"  = ["F401"]
"benchmarks/*" = ["E402", "B023"]
"tests/*"      = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["serron"]

[tool.ruff.format]
quote-style           = "double"
indent-style          = "space"
docstring-code-format = true


[tool.pyrefly]
preset            = "strict"
python-version    = "3.12"
search-path       = [".", "packages/serron/torch-ext"]
project-excludes  = ["**/build/**", "dist/**", "cmake-build-*/**", "**/.venv/**"]
ignore-missing-imports = ["cupy", "cupyx.*"]

[tool.pyrefly.errors]
# Lambda parameters cannot be annotated, so this only forces lambdas to be rewritten as defs.
implicit-any-lambda = false
unused-ignore = true
