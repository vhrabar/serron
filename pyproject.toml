[project]
name = "serron-workspace"
version = "0"
dependencies = [
    "kornia>=0.9.0; sys_platform != 'win32' or platform_machine != 'ARM64'",
    "scikit-build-core==1.1.1",
    "scipy-stubs~=1.18.1.1",
    "serron",
    "torch>=2.13",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu129"
url = "https://download.pytorch.org/whl/cu129"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu134"
url = "https://download.pytorch.org/whl/cu134"
explicit = true

[[tool.uv.index]]
name = "nvidia-cu134-win-arm64"
url = "https://pypi.nvidia.com/nvtorch_oot/"
explicit = true

[[tool.uv.index]]
name = "pytorch-rocm100"
url = "https://download.pytorch.org/whl/rocm10.0"
explicit = true

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
serron = { workspace = true }
torch = [
    { index = "pytorch-cpu", group = "cpu" },
    { index = "pytorch-cpu", group = "cpu-newest" },
    { index = "pytorch-cu129", group = "cu129" },
    { index = "pytorch-cu132", group = "cu132" },
    { index = "pytorch-cu132", group = "cu132-newest" },
    { index = "pytorch-cu134", group = "cu134", marker = "platform_machine == 'x86_64' or platform_machine == 'AMD64'" },
    { index = "nvidia-cu134-win-arm64", group = "cu134-win-arm64", marker = "sys_platform == 'win32' and platform_machine == 'ARM64'" },

    { index = "pytorch-rocm100", group = "rocm-gfx90a", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
    { index = "pytorch-rocm100", group = "rocm-gfx942", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
    { index = "pytorch-rocm100", group = "rocm-gfx950", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
    { index = "pytorch-rocm100", group = "rocm-gfx1036", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
    { index = "pytorch-rocm100", group = "rocm-gfx1100", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
    { index = "pytorch-rocm100", group = "rocm-gfx1201", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
]


triton-rocm = { index = "pytorch-rocm100", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" }
rocm = { index = "pytorch-rocm100", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" }
rocm-sdk-core = { index = "pytorch-rocm100", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" }
rocm-sdk-libraries = { index = "pytorch-rocm100", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" }
rocm-sdk-device-gfx90a = { index = "pytorch-rocm100", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" }
rocm-sdk-device-gfx942 = { index = "pytorch-rocm100", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" }
rocm-sdk-device-gfx950 = { index = "pytorch-rocm100", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" }
rocm-sdk-device-gfx1036 = { index = "pytorch-rocm100", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" }
rocm-sdk-device-gfx1100 = { index = "pytorch-rocm100", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" }
rocm-sdk-device-gfx1201 = { index = "pytorch-rocm100", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" }

[dependency-groups]
dev = [
    "pytest",
    "pytest-benchmark",
    "ruff==0.17.5",
    "pyrefly",
    "prek",
    "scikit-build-core",
    "cmake==4.4.4",
    "ninja",
]
cpu = ["torch==2.13.*"]
cu129 = ["torch==2.13.*"]
cu132 = ["torch==2.13.*"]
cpu-newest = ["torch>=2.14"]
cu132-newest = ["torch>=2.14"]
rocm-gfx90a = [
    "torch>=2.14; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "triton-rocm; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "rocm[libraries]==10.0.*; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "rocm-sdk-core; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "rocm-sdk-libraries; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "rocm[device-gfx90a]==10.0.*; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "rocm-sdk-device-gfx90a; sys_platform == 'linux' and platform_machine == 'x86_64'",
]
rocm-gfx942 = [
    "torch>=2.14; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "triton-rocm; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "rocm[libraries]==10.0.*; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "rocm-sdk-core; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "rocm-sdk-libraries; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "rocm[device-gfx942]==10.0.*; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "rocm-sdk-device-gfx942; sys_platform == 'linux' and platform_machine == 'x86_64'",
]
rocm-gfx950 = [
    "torch>=2.14; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "triton-rocm; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "rocm[libraries]==10.0.*; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "rocm-sdk-core; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "rocm-sdk-libraries; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "rocm[device-gfx950]==10.0.*; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "rocm-sdk-device-gfx950; sys_platform == 'linux' and platform_machine == 'x86_64'",
]
rocm-gfx1036 = [
    "torch>=2.14; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "triton-rocm; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "rocm[libraries]==10.0.*; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "rocm-sdk-core; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "rocm-sdk-libraries; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "rocm[device-gfx1036]==10.0.*; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "rocm-sdk-device-gfx1036; sys_platform == 'linux' and platform_machine == 'x86_64'",
]
rocm-gfx1100 = [
    "torch>=2.14; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "triton-rocm; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "rocm[libraries]==10.0.*; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "rocm-sdk-core; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "rocm-sdk-libraries; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "rocm[device-gfx1100]==10.0.*; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "rocm-sdk-device-gfx1100; sys_platform == 'linux' and platform_machine == 'x86_64'",
]
rocm-gfx1201 = [
    "torch>=2.14; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "triton-rocm; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "rocm[libraries]==10.0.*; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "rocm-sdk-core; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "rocm-sdk-libraries; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "rocm[device-gfx1201]==10.0.*; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "rocm-sdk-device-gfx1201; sys_platform == 'linux' and platform_machine == 'x86_64'",
]
cu134 = ["torch>=2.15"]
cu134-win-arm64 = ["torch>=2.14"]

[tool.uv]
override-dependencies = ["rocm[libraries]==10.0.*; sys_platform == 'linux' and platform_machine == 'x86_64'"]
no-build-isolation-package = ["serron"]
default-groups = ["dev"]
conflicts = [
    [
        { group = "cpu" },
        { group = "cu129" },
        { group = "cu132" },
        { group = "cpu-newest" },
        { group = "cu132-newest" },
        { group = "rocm-gfx90a" },
        { group = "rocm-gfx942" },
        { group = "rocm-gfx950" },
        { group = "rocm-gfx1036" },
        { group = "rocm-gfx1100" },
        { group = "rocm-gfx1201" },
        { group = "cu134" },
        { group = "cu134-win-arm64" },
    ],
]


[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py", "bench_*.py"]
addopts = "-ra --strict-markers"
markers = [
    "cuda: test requires a CUDA device",
]


[tool.ruff]
line-length = 130


[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "UP",
    "B",
    "SIM",
    "NPY",
    "RUF",
]
ignore = [
    "E501",
    "RUF012",
]

[tool.ruff.lint.per-file-ignores]
"__init__.py"  = ["F401"]
"benchmarks/*" = ["E402", "B023"]
"tests/*"      = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["serron"]

[tool.ruff.format]
quote-style           = "double"
indent-style          = "space"
docstring-code-format = true


[tool.pyrefly]
preset            = "strict"
python-version    = "3.12"
search-path       = [".", "packages/serron/torch-ext"]
project-excludes  = ["**/build/**", "dist/**", "cmake-build-*/**", "**/.venv/**", "scripts/rocm/**"]
ignore-missing-imports = ["cupy", "cupyx.*"]

[tool.pyrefly.errors]
# Lambda parameters cannot be annotated, so this only forces lambdas to be rewritten as defs.
implicit-any-lambda = false
unused-ignore = true
